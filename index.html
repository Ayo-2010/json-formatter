<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON Formatter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="prompt">$</span>
    <h1>json-formatter<span class="caret">_</span></h1>
  </div>
  <div class="toolbar">
    <label class="ctl">
      <span>indent</span>
      <select id="indent">
        <option value="2">2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="min">minified</option>
      </select>
    </label>
    <label class="ctl">
      <span>view</span>
      <select id="viewToggle">
        <option value="text">pretty text</option>
        <option value="tree">tree</option>
      </select>
    </label>
  </div>
</header>

<main class="panes">
  <section class="pane">
    <div class="pane-head">
      <h2>input.json</h2>
      <span class="pill" id="sizes">0 B in / 0 B out</span>
    </div>
    <textarea id="input" spellcheck="false" placeholder="{ &quot;paste&quot;: &quot;json here&quot; }"></textarea>
    <div class="row">
      <button id="formatBtn" class="btn btn-primary" type="button">Format</button>
      <button id="minifyBtn" class="btn" type="button">Minify</button>
      <button id="sampleBtn" class="btn" type="button">Sample</button>
      <button id="copyBtn" class="btn" type="button">Copy output</button>
      <button id="clearBtn" class="btn btn-quiet" type="button">Clear</button>
    </div>
  </section>

  <section class="pane">
    <div class="pane-head">
      <h2>output</h2>
      <span class="pill" id="status" data-state="idle">waiting for input</span>
    </div>
    <pre id="output" class="output"></pre>
    <div id="tree" class="tree" hidden></div>
  </section>
</main>

<p class="hint">Shortcut: <kbd>Ctrl</kbd> + <kbd>Enter</kbd> formats. Click the toggles in tree view to fold nodes. Everything runs offline in your browser.</p>

<script src="script.js"></script>
</body>
</html>
